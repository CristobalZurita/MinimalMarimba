# nginx/minimalmarimba.conf
# Configuración de nginx para servir Minimal Marimba como sitio estático.
# Copiar en /etc/nginx/sites-available/minimalmarimba y enlazar en sites-enabled.

server {
    listen 80;
    listen [::]:80;

    server_name minimalmarimba.cl www.minimalmarimba.cl;
    root /var/www/minimalmarimba;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Cacheo de assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|pdf)$ {
        expires 6M;
        add_header Cache-Control "public, immutable";
    }

    # Servir index.html por defecto
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirección de HTTP a HTTPS (descomentar cuando se configure SSL)
    # listen 443 ssl http2;
    # ssl_certificate /ruta/a/certificado.pem;
    # ssl_certificate_key /ruta/a/llave.pem;
}

