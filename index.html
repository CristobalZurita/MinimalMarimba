<!DOCTYPE HTML>
<html lang="es">
<head>
  <title>Minimal Marimba | Archivo Documental Vivo</title>
  <meta name="description" content="Archivo documental vivo de Minimal Marimba y la trayectoria artística de Cristóbal Zurita Quintanilla." />
  <meta property="og:title" content="Minimal Marimba | Archivo Documental Vivo" />
  <meta property="og:description" content="Percusión contemporánea, experimentación electrónica y archivo histórico." />
  <meta property="og:image" content="https://cristobalzurita.github.io/MinimalMarimba/Cover_photo_minimal_001.png" />
  <meta property="og:url" content="https://cristobalzurita.github.io/MinimalMarimba/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="author" content="Cristóbal Zurita Quintanilla" />
  <meta name="theme-color" content="#F28E2A" />
  <link rel="stylesheet" href="assets/css/archive.css" />
  <link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
  <style>
    .mm-splash {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)), url('Cover_photo_minimal_001.png') center/cover no-repeat;
      color: var(--mm-white);
      text-align: center;
      padding: 2rem;
    }
    .mm-splash__logo {
      max-width: 320px;
      width: 60vw;
      margin-bottom: 2rem;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }
    .mm-splash__title {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .mm-splash__subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--mm-gray-300);
      margin-bottom: 2.5rem;
      max-width: 600px;
    }
    .mm-splash__enter {
      font-size: 1.1rem;
      padding: 1rem 2.5rem;
    }
    .mm-splash__hint {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--mm-gray-500);
    }
  </style>
</head>
<body>
  <main class="mm-splash" role="main">
    <img src="MM_LOGOS/LOGOTIPO/PNG/Logo_white_yellowe.png" alt="Minimal Marimba" class="mm-splash__logo" />
    <h1 class="mm-splash__title">Archivo Documental Vivo</h1>
    <p class="mm-splash__subtitle">
      Percusión contemporánea y experimentación electrónica.<br />
      La trayectoria de Cristóbal Zurita Quintanilla.
    </p>
    <a href="home.html" class="mm-btn mm-btn--primary mm-splash__enter">Entrar al archivo</a>
    <p class="mm-splash__hint">Valparaíso, Chile · 2025</p>
  </main>
</body>
</html>
